<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akbarys — AR</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
body{margin:0;font-family:sans-serif}
model-viewer{position:fixed;inset:0;width:100%;height:100%}
#ar{position:fixed;bottom:15%;left:50%;transform:translateX(-50%);z-index:10;padding:14px 28px;border:0;border-radius:30px;background:#ff7a00;color:#fff;font-size:18px}
#msg{display:none;position:fixed;top:20px;left:5%;right:5%;z-index:10;padding:12px;border-radius:12px;background:#333;color:#fff;text-align:center;font-size:15px}
</style>
</head>
<body>
<model-viewer id="mv" src="akbarys.glb" alt="Ақбарыс" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate autoplay shadow-intensity="1">
<div slot="ar-button" style="display:none"></div>
</model-viewer>
<div id="msg">AR не поддерживается на этом телефоне. Покрутите барса пальцем!</div>
<button id="ar" onclick="document.getElementById('mv').activateAR()">Посмотреть в AR</button>
<script>
document.getElementById('mv').addEventListener('ar-status', e => {
  if (e.detail.status === 'failed') document.getElementById('msg').style.display = 'block';
});
</script>
</body>
</html>
